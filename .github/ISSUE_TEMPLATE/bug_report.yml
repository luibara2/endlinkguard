name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Most problems here come down to which build is installed and whether
        the shared secret matches the proxy, so please fill those in even if they seem obvious.

        **Found a security problem?** Do not file it here — see
        [SECURITY.md](https://github.com/luibara2/endlinkguard/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        Players connecting through the proxy are rejected with "verification failed", but joining
        the backend directly works.
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Which build is installed?
      description: Only one should be installed on a backend, never both.
      options:
        - "stock (endlinkguard-0.1.x) on official Endstone"
        - "modified (endlinkguard-1.0.x) on a patched Endstone runtime"
        - "Both — I am not sure which is active"
        - "Not sure"
    validations:
      required: true

  - type: input
    id: endstone-version
    attributes:
      label: Endstone and Minecraft version
      placeholder: "Endstone 0.11.7, Minecraft 1.26.40"
    validations:
      required: true

  - type: input
    id: endlink-version
    attributes:
      label: Endlink (proxy) version
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: secret-match
    attributes:
      label: Does shared_secret match the proxy's backendVerification.sharedSecret?
      description: A mismatch fails closed and is the most common cause of rejected joins.
      options:
        - "Yes, I checked both values"
        - "I think so, but I have not compared them"
        - "No"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: |
        The relevant part of the Endstone server log. **Please remove player IP addresses and XUIDs**
        if you would rather not publish them.
      render: text
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: config.toml
      description: "**Remove `shared_secret`** — it is the credential your whole network trusts."
      render: toml
    validations:
      required: false
