[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endlinkguard"
version = "1.0.3"
description = "Injects proxy-verified player identity before BDS loads native player data."
requires-python = ">=3.10"

[project.entry-points."endstone"]
endlinkguard = "endlinkguard:EndlinkGuardPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endlinkguard"]
