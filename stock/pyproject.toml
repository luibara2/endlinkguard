[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Endstone's plugin loader requires the DISTRIBUTION name to be "endstone-" plus the entry-point
# name (endstone/plugin/plugin_loader.py: it rejects anything else with "Invalid name" before the
# plugin is ever imported). The entry point below stays "endlinkguard", so the distribution has to
# be "endstone-endlinkguard". The import package stays `endlinkguard`; only the distribution is
# renamed, so the runtime plugin name, data folder and config path are unchanged.
name = "endstone-endlinkguard"
version = "0.1.7"
description = "Verifies proxy joins on unmodified Endstone and exposes proxy-backed identity data."
requires-python = ">=3.10"

[project.entry-points."endstone"]
endlinkguard = "endlinkguard:EndlinkGuardPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endlinkguard"]
